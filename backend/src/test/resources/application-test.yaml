spring:
  docker:
    compose:
      skip:
        in-tests: false
      file: classpath:compose.yaml
  datasource: {}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: dGVzdFNlY3JldEtleUZvckFnaWxlVHJhY2tJbnRlZ3JhdGlvblRlc3RpbmdQdXJwb3Nlc01pbg==
  expiration: 86400000
  refresh:
    expiration: 604800000

app:
  cors:
    allowed-origin: http://localhost:3000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
